services:
  - type: web
    name: webhook-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: WEBHOOK_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: webhook-db
          property: connectionString

databases:
  - name: webhook-db
    databaseName: webhookdb
    user: webhookuser
    plan: free
